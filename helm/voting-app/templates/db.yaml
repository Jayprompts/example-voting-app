{{- $ctx := dict "root" . "component" "db" }}
# PostgreSQL keeps the votes on a persistent EBS volume, so they survive pod restarts and redeploys
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  labels:
    {{- include "voting-app.labels" $ctx | nindent 4 }}
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels:
      {{- include "voting-app.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "voting-app.labels" $ctx | nindent 8 }}
    spec:
      securityContext:
        {{- include "voting-app.podSecurityContext" . | nindent 8 }}
        # the "postgres" user built into the official alpine image
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
      containers:
        - name: postgres
          image: {{ .Values.db.image }}
          env:
            - name: POSTGRES_USER
              value: {{ .Values.db.auth.username | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.db.auth.database | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-db
                  key: password
            # a subfolder, because a fresh EBS volume has a lost+found folder Postgres won't initialise over
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.db.auth.username | quote }}, "-h", "127.0.0.1"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.db.auth.username | quote }}, "-h", "127.0.0.1"]
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            {{- toYaml .Values.db.resources | nindent 12 }}
          securityContext:
            {{- include "voting-app.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- if not .Values.db.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
  {{- if .Values.db.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.db.persistence.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.db.persistence.size }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: db
  labels:
    {{- include "voting-app.labels" $ctx | nindent 4 }}
spec:
  selector:
    {{- include "voting-app.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
