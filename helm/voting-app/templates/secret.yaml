apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-db
  labels:
    {{- include "voting-app.labels" (dict "root" . "component" "db") | nindent 4 }}
type: Opaque
stringData:
  password: {{ required "db.auth.password is required (the pipeline passes it from the POSTGRES_PASSWORD GitHub secret)" .Values.db.auth.password | quote }}
