{{- $ctx := dict "root" . "component" "redis" }}
# Redis is only a queue between vote and worker, so it keeps no data on disk
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    {{- include "voting-app.labels" $ctx | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "voting-app.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "voting-app.labels" $ctx | nindent 8 }}
    spec:
      securityContext:
        {{- include "voting-app.podSecurityContext" . | nindent 8 }}
        # the "redis" user built into the official image
        runAsUser: 999
        runAsGroup: 999
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          securityContext:
            {{- include "voting-app.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    {{- include "voting-app.labels" $ctx | nindent 4 }}
spec:
  selector:
    {{- include "voting-app.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: redis
      port: 6379
      targetPort: redis
